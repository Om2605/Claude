<!--
  RepositoryPage.html
  "All Media" view: filter bar, card/table view toggle, results grid, pagination.
  Behaviour: renderRepository(), loadMedia() in JavaScript.html.
-->
<template id="page-repository">
  <section class="space-y-5">

    <div class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h2 class="text-2xl font-bold">All Media</h2>
        <p class="text-slate-400 text-sm">Browse, search and manage the repository</p>
      </div>
      <div class="flex items-center gap-2">
        <!-- View toggle -->
        <div class="flex rounded-lg border border-slate-200 dark:border-slate-700 overflow-hidden">
          <button id="view-cards" class="px-3 py-2 text-sm bg-brand-600 text-white" title="Card view">
            <i class="fa-solid fa-grip"></i>
          </button>
          <button id="view-table" class="px-3 py-2 text-sm bg-white dark:bg-slate-800" title="Table view">
            <i class="fa-solid fa-table-list"></i>
          </button>
        </div>
        <a href="#upload" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add</a>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="ui-card shadow-card p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3">
      <div class="lg:col-span-2">
        <label class="label">Search</label>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="f-search" class="field pl-9" placeholder="Title, description, creator…">
        </div>
      </div>
      <div>
        <label class="label">Type</label>
        <select id="f-type" class="field"><option value="">All</option></select>
      </div>
      <div>
        <label class="label">Department</label>
        <select id="f-dept" class="field"><option value="">All</option></select>
      </div>
      <div>
        <label class="label">Grade</label>
        <select id="f-grade" class="field"><option value="">All</option></select>
      </div>
      <div class="flex items-end">
        <button id="f-reset" class="btn btn-ghost w-full"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      </div>
    </div>

    <!-- Results meta -->
    <div class="flex items-center justify-between text-sm text-slate-400">
      <span id="results-meta">—</span>
      <button id="btn-export" class="btn btn-ghost text-xs"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
    </div>

    <!-- Card grid -->
    <div id="media-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

    <!-- Table -->
    <div id="media-table-wrap" class="ui-card shadow-card overflow-x-auto hidden">
      <table class="data-table">
        <thead>
          <tr>
            <th>Title</th><th>Type</th><th>Department</th><th>Grade</th>
            <th>Views</th><th>Status</th><th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="media-tbody"></tbody>
      </table>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16 text-slate-400">
      <i class="fa-regular fa-folder-open text-5xl mb-3"></i>
      <p class="font-medium">No media found</p>
      <p class="text-sm">Try adjusting your filters or add new media.</p>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="flex items-center justify-center gap-1 pt-2"></div>
  </section>
</template>
