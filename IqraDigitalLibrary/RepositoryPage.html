<!--
  RepositoryPage.html
  "All Media" view: filter bar, card/table view toggle, results grid, pagination.
  Behaviour: renderRepository(), loadMedia() in JavaScript.html.
-->
<template id="page-repository">
  <section class="space-y-5">

    <div class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <h2 class="text-2xl font-bold" data-i18n="pageRepoTitle">สื่อทั้งหมด</h2>
        <p class="text-slate-400 text-sm" data-i18n="pageRepoSub">ค้นหาและจัดการสื่อการสอน</p>
      </div>
      <div class="flex items-center gap-2">
        <!-- View toggle -->
        <div class="flex rounded-lg border border-slate-200 dark:border-slate-700 overflow-hidden">
          <button id="view-cards" class="px-3 py-2 text-sm bg-brand-600 text-white" title="Card view">
            <i class="fa-solid fa-grip"></i>
          </button>
          <button id="view-table" class="px-3 py-2 text-sm bg-white dark:bg-slate-800" title="Table view">
            <i class="fa-solid fa-table-list"></i>
          </button>
        </div>
        <a href="#upload" class="btn btn-primary"><i class="fa-solid fa-plus"></i> <span data-i18n="btnAdd">เพิ่ม</span></a>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="ui-card shadow-card p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-3">
      <div class="lg:col-span-2">
        <label class="label" data-i18n="labelSearch">ค้นหา</label>
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="f-search" class="field pl-9"
                 data-i18n-placeholder="placeholderSearch"
                 placeholder="ชื่อ คำอธิบาย ผู้สร้าง…">
        </div>
      </div>
      <div>
        <label class="label" data-i18n="labelType">ประเภท</label>
        <select id="f-type" class="field"><option value="" data-i18n="optAll">ทั้งหมด</option></select>
      </div>
      <div>
        <label class="label" data-i18n="labelDept">แผนก</label>
        <select id="f-dept" class="field"><option value="" data-i18n="optAll">ทั้งหมด</option></select>
      </div>
      <div>
        <label class="label" data-i18n="labelGrade">ระดับชั้น</label>
        <select id="f-grade" class="field"><option value="" data-i18n="optAll">ทั้งหมด</option></select>
      </div>
      <div class="flex items-end">
        <button id="f-reset" class="btn btn-ghost w-full">
          <i class="fa-solid fa-rotate-left"></i> <span data-i18n="btnReset">รีเซ็ต</span>
        </button>
      </div>
    </div>

    <!-- Results meta -->
    <div class="flex items-center justify-between text-sm text-slate-400">
      <span id="results-meta">—</span>
      <button id="btn-export" class="btn btn-ghost text-xs">
        <i class="fa-solid fa-file-csv"></i> <span data-i18n="btnExportCsv">ส่งออก CSV</span>
      </button>
    </div>

    <!-- Card grid -->
    <div id="media-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

    <!-- Table -->
    <div id="media-table-wrap" class="ui-card shadow-card overflow-x-auto hidden">
      <table class="data-table">
        <thead>
          <tr>
            <th data-i18n="colTitle">ชื่อ</th>
            <th data-i18n="colType">ประเภท</th>
            <th data-i18n="colDept">แผนก</th>
            <th data-i18n="colGrade">ระดับชั้น</th>
            <th data-i18n="colViews">ยอดดู</th>
            <th data-i18n="colStatus">สถานะ</th>
            <th class="text-right" data-i18n="colActions">จัดการ</th>
          </tr>
        </thead>
        <tbody id="media-tbody"></tbody>
      </table>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16 text-slate-400">
      <i class="fa-regular fa-folder-open text-5xl mb-3"></i>
      <p class="font-medium" data-i18n="noMediaFound">ไม่พบสื่อ</p>
      <p class="text-sm" data-i18n="noMediaSub">ลองเปลี่ยนตัวกรองหรือเพิ่มสื่อใหม่</p>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="flex items-center justify-center gap-1 pt-2"></div>
  </section>
</template>
