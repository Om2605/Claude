<!--
  UploadPage.html
  "Add New Media" view: drag & drop file upload with progress bar, or external
  link entry, plus the metadata form. Behaviour: renderUpload() in JavaScript.html.
-->
<template id="page-upload">
  <section class="max-w-3xl mx-auto space-y-6">

    <div>
      <h2 class="text-2xl font-bold">Add New Media</h2>
      <p class="text-slate-400 text-sm">Upload a file to Google Drive or link external media</p>
    </div>

    <form id="upload-form" class="space-y-6">

      <!-- Source toggle: file vs link -->
      <div class="flex gap-2">
        <button type="button" id="src-file" class="btn btn-primary flex-1"><i class="fa-solid fa-file-arrow-up"></i> Upload File</button>
        <button type="button" id="src-link" class="btn btn-ghost flex-1"><i class="fa-solid fa-link"></i> External Link</button>
      </div>

      <!-- File upload zone -->
      <div id="file-section">
        <label class="label">File</label>
        <div id="dropzone" class="dropzone p-8 text-center">
          <input type="file" id="file-input" class="hidden">
          <i class="fa-solid fa-cloud-arrow-up text-4xl text-brand-400 mb-3"></i>
          <p class="font-medium">Drag &amp; drop a file here, or
            <span class="text-brand-600 underline cursor-pointer" id="browse-link">browse</span>
          </p>
          <p class="text-xs text-slate-400 mt-1" id="dz-hint">Documents, images, audio, video, PDF — up to 50&nbsp;MB</p>
        </div>

        <!-- Selected file + progress -->
        <div id="file-preview" class="hidden mt-3 ui-card shadow-card p-4">
          <div class="flex items-center gap-3">
            <i id="file-icon" class="fa-solid fa-file text-2xl text-brand-500"></i>
            <div class="flex-1 min-w-0">
              <p id="file-name" class="font-medium truncate"></p>
              <p id="file-size" class="text-xs text-slate-400"></p>
            </div>
            <button type="button" id="file-remove" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="progress-track mt-3"><div id="progress-bar" class="progress-bar"></div></div>
          <p id="progress-label" class="text-xs text-slate-400 mt-1">Ready</p>
        </div>
      </div>

      <!-- External link -->
      <div id="link-section" class="hidden">
        <label class="label">External URL</label>
        <input id="m-link" class="field" placeholder="https://… (YouTube, web page, shared drive, etc.)">
      </div>

      <!-- Metadata -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="md:col-span-2">
          <label class="label">Media Title <span class="text-red-500">*</span></label>
          <input id="m-title" class="field" required>
        </div>
        <div>
          <label class="label">Media Type <span class="text-red-500">*</span></label>
          <select id="m-type" class="field" required></select>
        </div>
        <div>
          <label class="label">Department / Subject Group <span class="text-red-500">*</span></label>
          <select id="m-dept" class="field" required></select>
        </div>
        <div>
          <label class="label">Grade Level <span class="text-red-500">*</span></label>
          <select id="m-grade" class="field" required></select>
        </div>
        <div>
          <label class="label">Publication Status</label>
          <select id="m-status" class="field"></select>
        </div>
        <div class="md:col-span-2">
          <label class="label">Creator Name</label>
          <input id="m-creator" class="field" placeholder="Defaults to your account">
        </div>
        <div class="md:col-span-2">
          <label class="label">Description</label>
          <textarea id="m-desc" rows="3" class="field" placeholder="Short summary of the material…"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2">
        <a href="#repository" class="btn btn-ghost">Cancel</a>
        <button type="submit" id="save-btn" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> Save Media
        </button>
      </div>
    </form>
  </section>
</template>
