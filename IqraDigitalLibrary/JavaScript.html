  JavaScript.html
  ---------------------------------------------------------------------------
  All client-side logic for the SPA:

    0.  i18n              - TRANSLATIONS, t(), initLang(), setLang(), applyI18n()

    10. Shared helpers    - formatting, icons, file download, detail modal

  ---------------------------------------------------------------------------

/** Active language code — set by initLang() on boot. */
var LANG = 'th';

/**
 * Reads localStorage and applies the saved language, defaulting to 'th'.
 * Must be called before any rendering.
 */
function initLang() {
  var saved = localStorage.getItem('iqra-lang');
  LANG = (saved === 'en' || saved === 'th') ? saved : 'th';
  document.documentElement.lang = LANG;
  var label = document.getElementById('lang-label');
  if (label) label.textContent = LANG.toUpperCase();
}

/**
 * Switches to the given language, persists the choice, re-applies DOM strings
 * and re-renders the current page so dynamic content updates too.
 * @param {string} lang 'th' | 'en'
 */
function setLang(lang) {
  LANG = lang;
  localStorage.setItem('iqra-lang', lang);
  document.documentElement.lang = lang;
  document.title = t('appTitle');
  var label = document.getElementById('lang-label');
  if (label) label.textContent = lang.toUpperCase();
  applyI18n();
  route();  // re-render current page with new language
}

/**
 * Returns the translation for a key in the active language.
 * Falls back to English, then the key itself.
 * @param {string} key Translation key.
 * @return {string}
 */
function t(key) {
  return (TRANSLATIONS[LANG] && TRANSLATIONS[LANG][key] != null)
    ? TRANSLATIONS[LANG][key]
    : ((TRANSLATIONS.en && TRANSLATIONS.en[key] != null) ? TRANSLATIONS.en[key] : key);
}

/**
 * Walks the document for [data-i18n] and [data-i18n-placeholder] attributes
 * and sets textContent / placeholder from the translation map.
 * Call after page load and after every language switch.
 */
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  document.querySelectorAll('[data-i18n-title]').forEach(function (el) {
    el.title = t(el.getAttribute('data-i18n-title'));
  });
}

/* ===========================================================================
   1. SERVER BRIDGE
   =========================================================================== */

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fn].apply(google.script.run, args);
  });
}

});
function toastOk(msg)  { Toast.fire({ icon: 'success', title: msg }); }
function toastErr(msg) { Toast.fire({ icon: 'error',   title: msg }); }
function showError(err) {
  var msg = (err && err.message) ? err.message : String(err);
  Swal.fire({ icon: 'error', title: t('errSomethingWrong'), text: msg });
}

/* ===========================================================================
   2. APP STATE & BOOT
   =========================================================================== */

var APP = {
  user: null, options: null, settings: null,
  favorites: [],
  charts: {},
  repo: { page: 1, view: 'cards', filters: {}, lastResult: null }
};

document.addEventListener('DOMContentLoaded', boot);

async function boot() {
  document.getElementById('year').textContent = new Date().getFullYear();
  initLang();           // set language before anything renders
  applyI18n();          // update static sidebar/header strings
  document.title = t('appTitle');
  initTheme();
  wireChrome();

  try {
    var data = await api.bootstrap();
    APP.user    = data.user;
    APP.options = data.options;
    APP.settings = data.settings;
    paintUserChrome();
    api.myFavorites().then(function (f) { APP.favorites = f || []; }).catch(function () {});
  } catch (err) {
    showError(err);
  }

  window.addEventListener('hashchange', route);
  if (!location.hash) {
    location.hash = '#' + (window.INITIAL_PAGE || 'dashboard');
  } else {
    route();
  }
}

function paintUserChrome() {
  var u = APP.user || {};
  document.getElementById('user-email').textContent = u.email || 'Guest';
  document.getElementById('user-role').textContent  = u.role  || 'Viewer';
  document.getElementById('user-avatar').textContent = (u.email ? u.email[0] : '?').toUpperCase();
  if (!u.canEdit) {
    ['upload', 'categories'].forEach(function (p) {
      var link = document.querySelector('.nav-link[data-page="' + p + '"]');
      if (link) link.classList.add('hidden');
    });
  }
}

/* ===========================================================================
   3. ROUTER
   =========================================================================== */

var PAGES = {
  dashboard:  { template: 'page-dashboard',  render: renderDashboard },
  repository: { template: 'page-repository', render: renderRepository },
  upload:     { template: 'page-upload',     render: renderUpload },
  categories: { template: 'page-categories', render: renderCategories },
  reports:    { template: 'page-reports',    render: renderReports },
  settings:   { template: 'page-settings',   render: renderSettings }
};

function route() {
  var page = (location.hash || '#dashboard').slice(1).split('?')[0] || 'dashboard';
  if (!PAGES[page]) page = 'dashboard';

  if ((page === 'upload' || page === 'categories') && APP.user && !APP.user.canEdit) {
    toastErr(t('permissionError'));
    location.hash = '#dashboard';
    return;
  }

  setActiveNav(page);
  destroyCharts();
  mountTemplate(PAGES[page].template);
  applyI18n();          // update data-i18n nodes in the freshly mounted template
  closeSidebar();
  try { PAGES[page].render(); } catch (err) { showError(err); }
}

function mountTemplate(templateId) {
  var tpl = document.getElementById(templateId);
  var host = document.getElementById('app-content');
  host.innerHTML = '';
  host.appendChild(tpl.content.cloneNode(true));
}

function setActiveNav(page) {
  document.querySelectorAll('.nav-link').forEach(function (a) {
    a.classList.toggle('active', a.dataset.page === page);
  });
}

   4. DASHBOARD PAGE
   =========================================================================== */

async function renderDashboard() {
  var cards = document.getElementById('stat-cards');
  cards.innerHTML = skeletonCards(4);
  try {
    var d = await api.dashboard();
    cards.innerHTML = [
      statCard(t('totalMedia'),     d.totals.media,      'fa-photo-film', 'brand'),
      statCard(t('totalViews'),     d.totals.views,      'fa-eye',        'brand'),
      statCard(t('totalDownloads'), d.totals.downloads,  'fa-download',   'accent'),
      statCard(t('departments'),    d.totals.departments, 'fa-tags',      'brand')
    ].join('');

    drawDoughnut('chart-type', d.byType);
    drawLine('chart-uploads', d.uploadsByMonth, t('uploadsTrend'));

    document.getElementById('recent-list').innerHTML =
      (d.recent.length ? d.recent.map(miniRow).join('') : emptyLi(t('noUploadsYet')));
    document.getElementById('top-list').innerHTML =
      (d.topViewed.length ? d.topViewed.map(miniRow).join('') : emptyLi(t('noDataYet')));
  } catch (err) { showError(err); }
}

function statCard(label, value, icon, tone) {
  var bg = tone === 'accent' ? 'bg-accent-100 text-accent-400' : 'bg-brand-100 text-brand-600';
  return '<div class="ui-card shadow-card p-4 flex items-center gap-4">' +
    '<div class="w-12 h-12 rounded-xl flex items-center justify-center ' + bg + '">' +
    '<i class="fa-solid ' + icon + ' text-lg"></i></div>' +
    '<div><p class="text-2xl font-bold">' + value + '</p>' +
    '<p class="text-xs text-slate-400">' + label + '</p></div></div>';
}

function miniRow(m) {
  return '<li class="py-2 flex items-center gap-3 cursor-pointer hover:opacity-80" onclick="openDetail(\'' + m.mediaId + '\')">' +
    '<i class="fa-solid ' + typeIcon(m.mediaType) + ' text-brand-500 w-5 text-center"></i>' +
    '<div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">' + escapeHtml(m.title) + '</p>' +
    '<p class="text-xs text-slate-400">' + typeLabel(m.mediaType) + ' · ' + escapeHtml(m.department || '—') + '</p></div>' +
    '<span class="text-xs text-slate-400"><i class="fa-solid fa-eye"></i> ' + (m.viewCount || 0) + '</span></li>';
}

/* ===========================================================================
   5. REPOSITORY PAGE
   =========================================================================== */

function renderRepository() {
  fillTypeSelect(document.getElementById('f-type'), true);
  fillSelect(document.getElementById('f-dept'),  APP.options.departments, true);
  fillSelect(document.getElementById('f-grade'), APP.options.gradeLevels, true);

  var search = document.getElementById('f-search');
  search.addEventListener('input', debounce(function () { APP.repo.page = 1; loadMedia(); }, 350));
  ['f-type', 'f-dept', 'f-grade'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () { APP.repo.page = 1; loadMedia(); });
  });
  document.getElementById('f-reset').addEventListener('click', function () {
    search.value = '';
    ['f-type', 'f-dept', 'f-grade'].forEach(function (id) { document.getElementById(id).value = ''; });
    APP.repo.page = 1; loadMedia();
  });
  document.getElementById('view-cards').addEventListener('click', function () { setRepoView('cards'); });
  document.getElementById('view-table').addEventListener('click', function () { setRepoView('table'); });
  document.getElementById('btn-export').addEventListener('click', exportCsv);

  setRepoView(APP.repo.view);
  loadMedia();
}

function setRepoView(view) {
  APP.repo.view = view;
  var grid  = document.getElementById('media-grid');
  var table = document.getElementById('media-table-wrap');
  var bC = document.getElementById('view-cards');
  var bT = document.getElementById('view-table');
  var on  = 'bg-brand-600 text-white', off = 'bg-white dark:bg-slate-800';
  if (view === 'cards') {
    grid.classList.remove('hidden'); table.classList.add('hidden');
    bC.className = 'px-3 py-2 text-sm ' + on; bT.className = 'px-3 py-2 text-sm ' + off;
  } else {
    grid.classList.add('hidden'); table.classList.remove('hidden');
    bT.className = 'px-3 py-2 text-sm ' + on; bC.className = 'px-3 py-2 text-sm ' + off;
  }
  if (APP.repo.lastResult) paintMedia(APP.repo.lastResult);
}

async function loadMedia() {
  var grid = document.getElementById('media-grid');
  if (APP.repo.view === 'cards') grid.innerHTML = skeletonCards(8);

  var params = {
    q:           document.getElementById('f-search').value.trim(),
    type:        document.getElementById('f-type').value,
    department:  document.getElementById('f-dept').value,
    gradeLevel:  document.getElementById('f-grade').value,
    page:        APP.repo.page,
    pageSize:    APP.options.pageSize
  };
  APP.repo.filters = params;

  try {
    var hasF = params.q || params.type || params.department || params.gradeLevel;
    var result = hasF ? await api.search(params) : await api.list(params);
    APP.repo.lastResult = result;
    paintMedia(result);
  } catch (err) { showError(err); }
}

function paintMedia(result) {
  var items = result.items || [];
  var meta  = document.getElementById('results-meta');
  var empty = document.getElementById('empty-state');
  var grid  = document.getElementById('media-grid');
  var tbody = document.getElementById('media-tbody');

  meta.textContent = result.total + ' · ' + result.page + '/' + result.totalPages;

  if (!items.length) {
    empty.classList.remove('hidden');
    grid.innerHTML = ''; tbody.innerHTML = '';
    renderPagination(result); return;
  }
  empty.classList.add('hidden');

  if (APP.repo.view === 'cards') {
    grid.innerHTML = items.map(mediaCard).join('');
  } else {
    tbody.innerHTML = items.map(mediaTableRow).join('');
  }
  renderPagination(result);
}

function mediaCard(m) {
  var fav = APP.favorites.indexOf(m.mediaId) !== -1;
  var thumb = m.thumbnailUrl
    ? '<img src="' + m.thumbnailUrl + '" class="w-full h-40 object-cover bg-slate-100" ' +
      'onerror="this.replaceWith(thumbFallback(\'' + m.mediaType + '\'))">'
    : thumbFallbackHtml(m.mediaType);

  return '<div class="ui-card media-card shadow-card flex flex-col">' +
    '<div class="relative cursor-pointer" onclick="openDetail(\'' + m.mediaId + '\')">' + thumb +
      '<span class="badge badge-type absolute top-2 left-2"><i class="fa-solid ' + typeIcon(m.mediaType) + '"></i>' + typeLabel(m.mediaType) + '</span>' +
      '<button class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 dark:bg-slate-900/80 flex items-center justify-center"' +
        ' onclick="event.stopPropagation();toggleFav(\'' + m.mediaId + '\',this)">' +
        '<i class="' + (fav ? 'fa-solid text-red-500' : 'fa-regular text-slate-400') + ' fa-heart"></i></button>' +
    '</div>' +
    '<div class="p-4 flex-1 flex flex-col">' +
      '<h3 class="font-semibold line-clamp-2 mb-1">' + escapeHtml(m.title) + '</h3>' +
      '<p class="text-xs text-slate-400 mb-2">' + escapeHtml(m.department || '—') + ' · ' + escapeHtml(m.gradeLevel || '—') + '</p>' +
      '<p class="text-sm text-slate-500 dark:text-slate-400 line-clamp-2 flex-1">' + escapeHtml(m.description || '') + '</p>' +
      '<div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100 dark:border-slate-700">' +
        '<span class="text-xs text-slate-400"><i class="fa-solid fa-eye"></i> ' + (m.viewCount || 0) + '</span>' +
        statusBadge(m.status) +
      '</div>' +
      '<div class="flex gap-2 mt-3">' +
        '<button class="btn btn-ghost flex-1 text-xs" onclick="openDetail(\'' + m.mediaId + '\')"><i class="fa-solid fa-eye"></i> ' + t('btnView') + '</button>' +
        (m.driveLink ? '<button class="btn btn-primary flex-1 text-xs" onclick="downloadMedia(\'' + m.mediaId + '\')"><i class="fa-solid fa-download"></i></button>' : '') +
        editButtons(m) +
      '</div>' +
    '</div></div>';
}

function mediaTableRow(m) {
  return '<tr>' +
    '<td><button class="text-left font-medium hover:text-brand-600" onclick="openDetail(\'' + m.mediaId + '\')">' + escapeHtml(m.title) + '</button></td>' +
    '<td><span class="badge badge-type"><i class="fa-solid ' + typeIcon(m.mediaType) + '"></i>' + typeLabel(m.mediaType) + '</span></td>' +
    '<td>' + escapeHtml(m.department || '—') + '</td>' +
    '<td>' + escapeHtml(m.gradeLevel || '—') + '</td>' +
    '<td>' + (m.viewCount || 0) + '</td>' +
    '<td>' + statusBadge(m.status) + '</td>' +
    '<td class="text-right whitespace-nowrap">' +
      (m.driveLink ? '<button class="btn btn-ghost text-xs" onclick="downloadMedia(\'' + m.mediaId + '\')"><i class="fa-solid fa-download"></i></button> ' : '') +
      editButtons(m) +
    '</td></tr>';
}

function editButtons(m) {
  if (!APP.user || !APP.user.canEdit) return '';
  return '<button class="btn btn-ghost text-xs" title="' + t('btnEdit') + '" onclick="editMedia(\'' + m.mediaId + '\')"><i class="fa-solid fa-pen"></i></button> ' +
    '<button class="btn btn-ghost text-xs text-red-500" title="' + t('btnDelete') + '" onclick="confirmDelete(\'' + m.mediaId + '\',\'' + escapeAttr(m.title) + '\')"><i class="fa-solid fa-trash"></i></button>';
}

function renderPagination(result) {
  var el = document.getElementById('pagination');
  if (result.totalPages <= 1) { el.innerHTML = ''; return; }
  var html = pageBtn('«', result.page > 1, result.page - 1);
  for (var p = 1; p <= result.totalPages; p++) {
    if (p === 1 || p === result.totalPages || Math.abs(p - result.page) <= 1) {
      html += pageBtn(p, true, p, p === result.page);
    } else if (Math.abs(p - result.page) === 2) {
      html += '<span class="px-2 text-slate-400">…</span>';
    }
  }
  html += pageBtn('»', result.page < result.totalPages, result.page + 1);
  el.innerHTML = html;
}

function pageBtn(label, enabled, target, active) {
  var cls = active ? 'bg-brand-600 text-white' : 'bg-white dark:bg-slate-800 hover:bg-brand-50 dark:hover:bg-slate-700';
  return '<button ' + (enabled ? '' : 'disabled') +
    ' class="btn ' + cls + ' px-3 py-1.5 text-sm border border-slate-200 dark:border-slate-700"' +
    (enabled ? ' onclick="gotoPage(' + target + ')"' : '') + '>' + label + '</button>';
}

function gotoPage(p) { APP.repo.page = p; loadMedia(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ----------------------------- CRUD actions ----------------------------- */

function confirmDelete(id, title) {
  Swal.fire({
    icon: 'warning',
    title: t('deleteConfirmTitle'),
    html: t('deleteConfirmHtml').replace('{title}', escapeHtml(title)),
    showCancelButton: true,
    confirmButtonText: t('btnDelete'),
    confirmButtonColor: '#ef4444'
  }).then(async function (r) {
    if (!r.isConfirmed) return;
    try { await api.remove(id); toastOk(t('mediaDeletedMsg')); loadMedia(); }
    catch (err) { showError(err); }
  });
}

async function editMedia(id) {
  try {
    var m = await api.getOne(id);
    var deptOpts   = APP.options.departments.map(opt(m.department)).join('');
    var typeOpts   = APP.options.mediaTypes.map(function (v) {
      return '<option value="' + v + '"' + (v === m.mediaType ? ' selected' : '') + '>' + typeLabel(v) + '</option>';
    }).join('');
    var gradeOpts  = APP.options.gradeLevels.map(opt(m.gradeLevel)).join('');
    var statusOpts = APP.options.statusOptions.map(function (v) {
      return '<option value="' + v + '"' + (v === m.status ? ' selected' : '') + '>' + statusLabelText(v) + '</option>';
    }).join('');

    var { value: form } = await Swal.fire({

      html:
        '<div class="text-left space-y-2">' +
        '<label class="label">' + t('labelTitleEdit') + '</label><input id="e-title" class="field" value="' + escapeAttr(m.title) + '">' +
        '<label class="label">' + t('fieldType') + '</label><select id="e-type" class="field">' + typeOpts + '</select>' +
        '<label class="label">' + t('fieldDept') + '</label><select id="e-dept" class="field">' + deptOpts + '</select>' +
        '<label class="label">' + t('fieldGrade') + '</label><select id="e-grade" class="field">' + gradeOpts + '</select>' +
        '<label class="label">' + t('fieldStatus') + '</label><select id="e-status" class="field">' + statusOpts + '</select>' +
        '<label class="label">' + t('fieldDesc') + '</label><textarea id="e-desc" class="field" rows="3">' + escapeHtml(m.description || '') + '</textarea>' +
        '</div>',
      focusConfirm: false,
      preConfirm: function () {
        return {
          title: document.getElementById('e-title').value.trim(),
          mediaType: document.getElementById('e-type').value,
          department: document.getElementById('e-dept').value,
          gradeLevel: document.getElementById('e-grade').value,
          status: document.getElementById('e-status').value,

        };
      }
    });
    if (!form) return;
    if (!form.title) { toastErr(t('errTitleRequired')); return; }
    await api.update(id, form);
    toastOk(t('mediaUpdatedMsg'));
    loadMedia();
  } catch (err) { showError(err); }
}

/* ===========================================================================
   6. UPLOAD PAGE
   =========================================================================== */

var uploadState = { file: null, base64: null, mode: 'file' };

function renderUpload() {
  uploadState = { file: null, base64: null, mode: 'file' };

  fillTypeSelect(document.getElementById('m-type'), false);
  fillSelect(document.getElementById('m-dept'),   APP.options.departments, false);
  fillSelect(document.getElementById('m-grade'),  APP.options.gradeLevels, false);
  fillStatusSelect(document.getElementById('m-status'), false);

  document.getElementById('dz-hint').textContent =
    APP.options.allowedExtensions.slice(0, 12).join(', ') + '… · ' +
    Math.round(APP.options.maxFileSize / 1024 / 1024) + ' MB';

  document.getElementById('src-file').addEventListener('click', function () { setUploadMode('file'); });
  document.getElementById('src-link').addEventListener('click', function () { setUploadMode('link'); });

  var dz    = document.getElementById('dropzone');
  var input = document.getElementById('file-input');
  document.getElementById('browse-link').addEventListener('click', function () { input.click(); });
  dz.addEventListener('click', function (e) { if (e.target.id !== 'browse-link') input.click(); });
  input.addEventListener('change', function () { if (input.files[0]) acceptFile(input.files[0]); });
  ['dragenter', 'dragover'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('dragover'); });
  });
  dz.addEventListener('drop', function (e) {
    if (e.dataTransfer.files[0]) acceptFile(e.dataTransfer.files[0]);
  });
  document.getElementById('file-remove').addEventListener('click', clearFile);
  document.getElementById('upload-form').addEventListener('submit', submitUpload);
}

function setUploadMode(mode) {
  uploadState.mode = mode;
  var fileSec = document.getElementById('file-section');
  var linkSec = document.getElementById('link-section');
  var bf = document.getElementById('src-file');
  var bl = document.getElementById('src-link');
  if (mode === 'file') {
    fileSec.classList.remove('hidden'); linkSec.classList.add('hidden');
    bf.className = 'btn btn-primary flex-1'; bl.className = 'btn btn-ghost flex-1';
  } else {
    fileSec.classList.add('hidden'); linkSec.classList.remove('hidden');
    bl.className = 'btn btn-primary flex-1'; bf.className = 'btn btn-ghost flex-1';
  }
}

function acceptFile(file) {
  var ext = (file.name.split('.').pop() || '').toLowerCase();
  if (APP.options.allowedExtensions.indexOf(ext) === -1) {
    toastErr('.' + ext + ' — ' + t('errExtNotAllowed'));
    return;
  }
  if (file.size > APP.options.maxFileSize) { toastErr(t('errFileTooLarge')); return; }
  uploadState.file = file;

  document.getElementById('file-preview').classList.remove('hidden');
  document.getElementById('file-name').textContent = file.name;
  document.getElementById('file-size').textContent = formatBytes(file.size);
  document.getElementById('file-icon').className = 'fa-solid ' + typeIcon(typeFromExt(ext)) + ' text-2xl text-brand-500';
  setProgress(0, t('progressReading'));

  var reader = new FileReader();
  reader.onprogress = function (e) {
    if (e.lengthComputable) setProgress(Math.round(e.loaded / e.total * 40), t('progressReadingPct'));
  };
  reader.onload = function () {
    uploadState.base64 = reader.result.split(',')[1];
    setProgress(40, t('progressReady'));
  };
  reader.onerror = function () { toastErr(t('errCouldNotRead')); };
  reader.readAsDataURL(file);

  var titleEl = document.getElementById('m-title');
  if (!titleEl.value) titleEl.value = file.name.replace(/\.[^.]+$/, '');
  document.getElementById('m-type').value = typeFromExt(ext);
}

function clearFile() {
  uploadState.file = null; uploadState.base64 = null;
  document.getElementById('file-input').value = '';
  document.getElementById('file-preview').classList.add('hidden');
  setProgress(0, t('progressDefault'));
}

function setProgress(pct, label) {
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = label + (pct ? ' (' + pct + '%)' : '');
}

async function submitUpload(e) {
  e.preventDefault();
  var saveBtn = document.getElementById('save-btn');
  var record = {
    title:       document.getElementById('m-title').value.trim(),
    mediaType:   document.getElementById('m-type').value,
    department:  document.getElementById('m-dept').value,
    gradeLevel:  document.getElementById('m-grade').value,
    status:      document.getElementById('m-status').value,
    creatorName: document.getElementById('m-creator').value.trim(),
    description: document.getElementById('m-desc').value.trim()
  };
  if (!record.title)      return toastErr(t('errTitleRequired'));
  if (!record.mediaType)  return toastErr(t('errTypeRequired'));
  if (!record.department) return toastErr(t('errDeptRequired'));
  if (!record.gradeLevel) return toastErr(t('errGradeRequired'));

  saveBtn.disabled = true;
  try {
    if (uploadState.mode === 'file') {
      if (!uploadState.base64) { saveBtn.disabled = false; return toastErr(t('errChooseFile')); }
      setProgress(60, t('progressUploading'));
      var up = await api.upload({
        data: uploadState.base64, fileName: uploadState.file.name,
        mimeType: uploadState.file.type, mediaType: record.mediaType
      });
      setProgress(85, t('progressSaving'));
      record.driveFileId  = up.fileId;
      record.driveLink    = up.url;
      record.thumbnailUrl = up.thumbnailUrl;
    } else {
      var link = document.getElementById('m-link').value.trim();
      if (!link) { saveBtn.disabled = false; return toastErr(t('errEnterUrl')); }
      record.driveLink = link;
      record.mediaType = record.mediaType || 'Link';
    }
    await api.save(record);
    setProgress(100, t('progressDone'));
    await Swal.fire({ icon: 'success', title: t('mediaSavedTitle'), timer: 1400, showConfirmButton: false });
    location.hash = '#repository';
  } catch (err) {
    showError(err);
  } finally {
    saveBtn.disabled = false;
  }
}

   7. CATEGORIES PAGE
   =========================================================================== */

async function renderCategories() {
  document.getElementById('cat-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var cat = {
      name:        document.getElementById('cat-name').value.trim(),
      type:        document.getElementById('cat-type').value,
      description: document.getElementById('cat-desc').value.trim()
    };
    if (!cat.name) return toastErr(t('errNameRequired'));
    try {
      await api.addCategory(cat);
      toastOk(t('categoryAddedMsg'));
      document.getElementById('cat-form').reset();
      loadCategories();
      APP.options.departments = (await api.categories())
        .filter(function (c) { return !c.type || c.type === 'Department'; })
        .map(function (c) { return c.name; });
    } catch (err) { showError(err); }
  });
  loadCategories();
}

async function loadCategories() {
  var tbody = document.getElementById('cat-tbody');
  tbody.innerHTML = '<tr><td colspan="4" class="text-center text-slate-400 py-6">' + t('loadingEllipsis') + '</td></tr>';
  try {
    var cats = await api.categories();
    if (!cats.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="text-center text-slate-400 py-6">' + t('noCategoriesYet') + '</td></tr>';
      return;
    }
    var canDelete = APP.user && APP.user.isAdmin;
    tbody.innerHTML = cats.map(function (c) {
      return '<tr>' +
        '<td class="font-medium">' + escapeHtml(c.name) + '</td>' +
        '<td>' + escapeHtml(c.type || 'Department') + '</td>' +
        '<td class="text-slate-400">' + escapeHtml(c.description || '—') + '</td>' +
        '<td class="text-right">' +
          (canDelete ? '<button class="btn btn-ghost text-xs text-red-500" onclick="deleteCategory(\'' + c.categoryId + '\',\'' + escapeAttr(c.name) + '\')"><i class="fa-solid fa-trash"></i></button>' : '<span class="text-xs text-slate-300">—</span>') +
        '</td></tr>';
    }).join('');
  } catch (err) { showError(err); }
}

function deleteCategory(id, name) {
  Swal.fire({
    icon: 'warning', title: t('deleteCatTitle'),
    text: '"' + name + '" — ' + t('deleteCatText'),
    showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: t('btnDelete')
  }).then(async function (r) {
    if (!r.isConfirmed) return;
    try { await api.deleteCategory(id); toastOk(t('categoryDeletedMsg')); loadCategories(); }
    catch (err) { showError(err); }
  });
}

   8. REPORTS PAGE
   =========================================================================== */

async function renderReports() {
  document.getElementById('rep-pdf').addEventListener('click', downloadPdf);
  document.getElementById('rep-csv').addEventListener('click', exportCsv);

  var cards = document.getElementById('rep-stat-cards');
  cards.innerHTML = skeletonCards(4);
  try {
    var d = await api.dashboard();
    cards.innerHTML = [
      statCard(t('totalMedia'),     d.totals.media,      'fa-photo-film', 'brand'),
      statCard(t('totalViews'),     d.totals.views,      'fa-eye',        'brand'),
      statCard(t('totalDownloads'), d.totals.downloads,  'fa-download',   'accent'),
      statCard(t('departments'),    d.totals.departments, 'fa-tags',      'brand')
    ].join('');
    drawBar('rep-chart-dept',   d.byDepartment, t('totalMedia'));
    drawDoughnut('rep-chart-status', d.byStatus);
    drawLine('rep-chart-trend', d.uploadsByMonth, t('uploadsTrend'));
  } catch (err) { showError(err); }
}

async function downloadPdf() {
  var btn = document.getElementById('rep-pdf');
  btn.disabled = true;
  try {
    var r = await api.reportPdf();
    downloadBase64(r.base64, r.mimeType, r.fileName);
    toastOk(t('reportDownloadedMsg'));
  } catch (err) { showError(err); } finally { btn.disabled = false; }
}

/* ===========================================================================
   9. SETTINGS PAGE
   =========================================================================== */

function renderSettings() {
  document.getElementById('set-email').textContent = APP.user.email  || 'Guest';
  document.getElementById('set-role').textContent  = APP.user.role   || 'Viewer';
  document.getElementById('set-domain').textContent = APP.settings.restrictToDomain
    ? (t('settingDomainOn') + ' (' + APP.settings.schoolDomain + ')') : t('settingDomainOff');

  document.getElementById('set-theme').addEventListener('click', toggleTheme);
  document.getElementById('set-export').addEventListener('click', exportCsv);

  var importInput = document.getElementById('set-import');
  if (!APP.user.canEdit) {
    importInput.disabled = true;
    importInput.parentElement.classList.add('opacity-50', 'pointer-events-none');
  }
  importInput.addEventListener('change', function () {
    var f = importInput.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = async function () {
      try {
        var res = await api.importCsv(reader.result);
        Swal.fire({
          icon: res.errors.length ? 'warning' : 'success',
          title: t('importCompleteTitle'),
          html: t('importedLabel') + ' <b>' + res.imported + '</b><br>' + t('skippedLabel') + ' <b>' + res.skipped + '</b>' +
            (res.errors.length ? '<br><small>' + res.errors.slice(0, 5).map(escapeHtml).join('<br>') + '</small>' : '')
        });
      } catch (err) { showError(err); }
      importInput.value = '';
    };
    reader.readAsText(f);
  });
}

/* ===========================================================================
   10. SHARED HELPERS
   =========================================================================== */

async function openDetail(id) {
  try {
    var m = await api.getOne(id);
    var comments = await api.comments(id);
    var fav = APP.favorites.indexOf(id) !== -1;

    var preview = m.thumbnailUrl
      ? '<img src="' + m.thumbnailUrl + '" class="w-full max-h-64 object-contain rounded-lg bg-slate-100" onerror="this.style.display=\'none\'">'
      : '<div class="w-full h-40 flex items-center justify-center rounded-lg bg-brand-50 dark:bg-slate-800"><i class="fa-solid ' + typeIcon(m.mediaType) + ' text-5xl text-brand-300"></i></div>';

    var qrId = 'qr-' + id.replace(/[^a-z0-9]/gi, '');
    var shareUrl = m.driveLink || (location.origin + location.pathname + '#repository');

    var html =
      '<div class="text-left">' +
        preview +
        '<div class="flex items-center gap-2 mt-3 flex-wrap">' +
          statusBadge(m.status) +
          '<span class="badge badge-type"><i class="fa-solid ' + typeIcon(m.mediaType) + '"></i>' + typeLabel(m.mediaType) + '</span>' +
          '<span class="text-xs text-slate-400"><i class="fa-solid fa-eye"></i> ' + (m.viewCount || 0) + ' ' + t('detailViews') + '</span>' +
        '</div>' +
        '<p class="text-sm text-slate-500 dark:text-slate-300 mt-3">' + escapeHtml(m.description || t('noDesc')) + '</p>' +
        '<dl class="grid grid-cols-2 gap-2 text-xs mt-3 text-slate-500">' +
          '<div><dt class="text-slate-400">' + t('detailDept') + '</dt><dd>' + escapeHtml(m.department || '—') + '</dd></div>' +
          '<div><dt class="text-slate-400">' + t('detailGrade') + '</dt><dd>' + escapeHtml(m.gradeLevel || '—') + '</dd></div>' +
          '<div><dt class="text-slate-400">' + t('detailCreator') + '</dt><dd>' + escapeHtml(m.creatorName || '—') + '</dd></div>' +
          '<div><dt class="text-slate-400">' + t('detailUploaded') + '</dt><dd>' + formatDate(m.uploadDate) + '</dd></div>' +
        '</dl>' +
        '<div class="flex items-center gap-2 mt-4">' +
          (m.driveLink ? '<a href="' + m.driveLink + '" target="_blank" class="btn btn-ghost text-sm"><i class="fa-solid fa-arrow-up-right-from-square"></i> ' + t('btnOpen') + '</a>' : '') +
          (m.driveLink ? '<button class="btn btn-primary text-sm" onclick="downloadMedia(\'' + id + '\')"><i class="fa-solid fa-download"></i> ' + t('btnDownload') + '</button>' : '') +
          '<button class="btn btn-ghost text-sm" id="d-fav"><i class="' + (fav ? 'fa-solid text-red-500' : 'fa-regular') + ' fa-heart"></i> ' + t('btnFavorite') + '</button>' +
        '</div>' +
        '<div class="mt-4 flex flex-col items-center gap-1 p-3 bg-slate-50 dark:bg-slate-800 rounded-lg">' +
          '<div id="' + qrId + '"></div><p class="text-xs text-slate-400">' + t('scanToShare') + '</p>' +
        '</div>' +
        commentsHtml(comments) +
      '</div>';

    Swal.fire({ title: m.title, html: html, width: 560, showConfirmButton: false, showCloseButton: true,
      didOpen: function () {
        try { new QRCode(document.getElementById(qrId), { text: shareUrl, width: 120, height: 120 }); } catch (e) {}
        document.getElementById('d-fav').addEventListener('click', function () { toggleFav(id, this); });
        var cb = document.getElementById('comment-submit');
        if (cb) cb.addEventListener('click', function () { submitComment(id); });
      }
    });
  } catch (err) { showError(err); }
}

function commentsHtml(comments) {
  var list = comments.length ? comments.map(function (c) {
    var stars = c.rating ? '<span class="text-accent-400">' + '★'.repeat(c.rating) + '</span> ' : '';
    return '<div class="py-2 border-b border-slate-100 dark:border-slate-700">' +
      '<p class="text-xs font-medium">' + escapeHtml(c.userName || c.userEmail) + ' ' + stars +
      '<span class="text-slate-400 font-normal">· ' + formatDate(c.createdDate) + '</span></p>' +
      '<p class="text-sm">' + escapeHtml(c.comment) + '</p></div>';
  }).join('') : '<p class="text-xs text-slate-400">' + t('noCommentsYet') + '</p>';

  return '<div class="mt-4"><h4 class="font-semibold text-sm mb-2">' +
    '<i class="fa-solid fa-comments text-brand-500 mr-1"></i>' + t('commentsTitle') + '</h4>' +
    '<div class="max-h-40 overflow-y-auto mb-2">' + list + '</div>' +
    '<div class="flex gap-2 items-start">' +
      '<select id="comment-rating" class="field w-20 text-sm"><option value="">★</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>' +
      '<textarea id="comment-text" class="field text-sm" rows="1" placeholder="' + t('commentPlaceholder') + '"></textarea>' +
      '<button id="comment-submit" class="btn btn-primary text-sm"><i class="fa-solid fa-paper-plane"></i></button>' +
    '</div></div>';
}

async function submitComment(id) {
  var text   = document.getElementById('comment-text').value.trim();
  var rating = document.getElementById('comment-rating').value;
  if (!text) return toastErr(t('errCommentEmpty'));
  try { await api.addComment(id, text, rating); openDetail(id); }
  catch (err) { showError(err); }
}

async function toggleFav(id, btn) {
  try {
    var r = await api.toggleFavorite(id);
    if (r.favorited) { if (APP.favorites.indexOf(id) === -1) APP.favorites.push(id); }
    else { APP.favorites = APP.favorites.filter(function (x) { return x !== id; }); }
    var icon = btn.querySelector('i');
    if (icon) icon.className = (r.favorited ? 'fa-solid text-red-500' : 'fa-regular text-slate-400') + ' fa-heart';
    toastOk(t(r.favorited ? 'addedToFavorites' : 'removedFromFavorites'));
  } catch (err) { showError(err); }
}

async function downloadMedia(id) {
  try {
    var m = await api.getOne(id);
    api.recordDownload(id, 'download').catch(function () {});
    var url = m.driveFileId ? 'https://drive.google.com/uc?export=download&id=' + m.driveFileId : m.driveLink;
    window.open(url, '_blank');
  } catch (err) { showError(err); }
}

async function exportCsv() {
  try {
    var r = await api.exportCsv();
    var blob = new Blob([r.content], { type: r.mimeType });
    triggerDownload(URL.createObjectURL(blob), r.fileName);
    toastOk(t('exportReadyMsg'));
  } catch (err) { showError(err); }
}

/* --- Chart.js helpers --- */
var PALETTE = ['#2563eb', '#60a5fa', '#fde047', '#34d399', '#f87171', '#a78bfa', '#fb923c', '#22d3ee'];

function chartTextColor() {
  return document.documentElement.classList.contains('dark') ? '#cbd5e1' : '#475569';
}

function drawDoughnut(canvasId, series) {
  var ctx = document.getElementById(canvasId); if (!ctx) return;
  APP.charts[canvasId] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: series.labels, datasets: [{ data: series.values, backgroundColor: PALETTE, borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { color: chartTextColor() } } } }
  });
}

function drawBar(canvasId, series, label) {
  var ctx = document.getElementById(canvasId); if (!ctx) return;
  APP.charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: series.labels, datasets: [{ label: label, data: series.values, backgroundColor: '#2563eb', borderRadius: 6 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: chartTextColor() } }, y: { ticks: { color: chartTextColor() }, beginAtZero: true } } }
  });
}

function drawLine(canvasId, series, label) {
  var ctx = document.getElementById(canvasId); if (!ctx) return;
  APP.charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels: series.labels, datasets: [{ label: label, data: series.values,
      borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.12)', fill: true, tension: 0.35, pointRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: chartTextColor() } }, y: { ticks: { color: chartTextColor() }, beginAtZero: true } } }
  });
}

function destroyCharts() {
  Object.keys(APP.charts).forEach(function (k) {
    try { APP.charts[k].destroy(); } catch (e) {}
    delete APP.charts[k];
  });
}

/* --- Theme (dark mode) --- */
function initTheme() {
  var saved = localStorage.getItem('iqra-theme');
  if (saved === 'dark') document.documentElement.classList.add('dark');
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
}
function toggleTheme() {
  var dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('iqra-theme', dark ? 'dark' : 'light');
  if (location.hash.indexOf('dashboard') !== -1) renderDashboard();
  if (location.hash.indexOf('reports') !== -1)   renderReports();
}

/* --- Sidebar (mobile) + language toggle wiring --- */
function wireChrome() {
  var sb = document.getElementById('sidebar');
  var bd = document.getElementById('backdrop');
  document.getElementById('menu-toggle').addEventListener('click', function () {
    sb.classList.toggle('-translate-x-full'); bd.classList.toggle('hidden');
  });
  bd.addEventListener('click', closeSidebar);

  /* Language toggle */
  document.getElementById('lang-toggle').addEventListener('click', function () {
    setLang(LANG === 'th' ? 'en' : 'th');
  });
}
function closeSidebar() {
  if (window.innerWidth < 1024) {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('backdrop').classList.add('hidden');
  }
}

/* --- Generic helpers --- */

/**
 * Fills a <select> with plain values (value == display label, or "All" at top).
 * For media type / status selects use the dedicated helpers below.
 */
function fillSelect(sel, values, includeAll) {
  if (!sel) return;
  sel.innerHTML = (includeAll ? '<option value="">' + t('optAll') + '</option>' : '') +
    values.map(function (v) { return '<option value="' + escapeAttr(v) + '">' + escapeHtml(v) + '</option>'; }).join('');
}

/** Fills a media-type <select> with translated display labels (value stays English). */
function fillTypeSelect(sel, includeAll) {
  if (!sel) return;
  sel.innerHTML = (includeAll ? '<option value="">' + t('optAll') + '</option>' : '') +
    APP.options.mediaTypes.map(function (v) {
      return '<option value="' + v + '">' + typeLabel(v) + '</option>';
    }).join('');
}

/** Fills a status <select> with translated labels. */
function fillStatusSelect(sel, includeAll) {
  if (!sel) return;
  sel.innerHTML = (includeAll ? '<option value="">' + t('optAll') + '</option>' : '') +
    APP.options.statusOptions.map(function (v) {
      return '<option value="' + v + '">' + statusLabelText(v) + '</option>';
    }).join('');
}

function opt(selected) {
  return function (v) {
    return '<option value="' + escapeAttr(v) + '"' + (v === selected ? ' selected' : '') + '>' + escapeHtml(v) + '</option>';
  };
}

/** Returns a localised label for a media type value. */
function typeLabel(type) {
  var map = { Document: 'typeDocument', Image: 'typeImage', Video: 'typeVideo', Audio: 'typeAudio', PDF: 'typePDF', Link: 'typeLink' };
  return t(map[type] || 'typeDocument');
}

/** Returns a localised label for a status value. */
function statusLabelText(status) {
  var map = { Published: 'statusPublished', Draft: 'statusDraft', Archived: 'statusArchived' };
  return t(map[status] || 'statusDraft');
}

function statusBadge(status) {
  var cls = status === 'Published' ? 'badge-published' : (status === 'Draft' ? 'badge-draft' : 'badge-archived');
  return '<span class="badge ' + cls + '">' + statusLabelText(status || 'Draft') + '</span>';
}

function typeIcon(type) {
  return ({ Document: 'fa-file-word', Image: 'fa-image', Video: 'fa-film',
            Audio: 'fa-music', PDF: 'fa-file-pdf', Link: 'fa-link' })[type] || 'fa-file';
}
function typeFromExt(ext) {
  if (['jpg','jpeg','png','gif','webp','svg','bmp'].indexOf(ext) !== -1) return 'Image';
  if (['mp4','webm','mov','avi','mkv'].indexOf(ext) !== -1) return 'Video';
  if (['mp3','wav','ogg','m4a','aac'].indexOf(ext) !== -1) return 'Audio';
  if (ext === 'pdf') return 'PDF';
  return 'Document';
}
function thumbFallbackHtml(type) {
  return '<div class="w-full h-40 flex items-center justify-center bg-brand-50 dark:bg-slate-800">' +
    '<i class="fa-solid ' + typeIcon(type) + ' text-4xl text-brand-300"></i></div>';
}
function thumbFallback(type) {
  var div = document.createElement('div');
  div.innerHTML = thumbFallbackHtml(type);
  return div.firstChild;
}
function skeletonCards(n) {
  var one = '<div class="ui-card shadow-card p-4"><div class="skeleton h-24 w-full"></div></div>';
  return new Array(n).fill(one).join('');
}
function emptyLi(text) { return '<li class="py-4 text-sm text-slate-400 text-center">' + text + '</li>'; }
function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function formatDate(v) {
  if (!v) return '—';
  var d = new Date(v); if (isNaN(d)) return '—';
  return d.toLocaleDateString(LANG === 'th' ? 'th-TH' : 'en-GB',
    { year: 'numeric', month: 'short', day: 'numeric' });
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function triggerDownload(url, fileName) {
  var a = document.createElement('a');
  a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
}
function downloadBase64(base64, mime, fileName) {
  var bin = atob(base64); var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  triggerDownload(URL.createObjectURL(new Blob([bytes], { type: mime })), fileName);
}
function debounce(fn, ms) {
  var tmr; return function () {
    var a = arguments, c = this; clearTimeout(tmr);
    tmr = setTimeout(function () { fn.apply(c, a); }, ms);
  };
}
</script>
